services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sapientum_demo
    ports:
      - 127.0.0.1:55433:5432
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d sapientum_demo]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  demo-postgres:
